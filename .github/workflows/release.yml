name: Release

on:
  push:
  pull_request:
    branches: [master]

permissions:
  contents: read

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write # GoReleaser creates the GitHub release and uploads assets
    steps:
      - name: Check out code
        uses: actions/checkout@v4.4.0
      - name: Normalize line endings (Windows)
        if: runner.os == 'Windows'
        run: |
          git config core.autocrlf false
          git config core.eol lf
          git checkout-index -f -a
      - name: Setup Go
        uses: actions/setup-go@v5.6.0
        with:
          go-version: ^1.25
          # Don't restore a cache in the job that builds the published
          # binaries: caches are writable from other workflow runs, so the
          # release build should fetch modules from source.
          cache: false

      - name: Set GOVERSION
        run: echo "GOVERSION=$(go version | sed -r 's/go version go(.*)\ .*/\1/')" >> $GITHUB_ENV
      - name: Set AirVersion
        run: echo "VERSION=${GITHUB_REF#refs/tags/}" >> $GITHUB_ENV
      - name: Show version
        run: echo ${{ env.GOVERSION }} ${{ env.VERSION }}

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v5.1.0
        with:
          distribution: goreleaser
          version: latest
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3.7.0
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3.12.0
      - name: Login to DockerHub
        uses: docker/login-action@v3.7.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Push to DockerHub
        id: docker_build
        uses: docker/build-push-action@v5.4.0
        with:
          push: true
          platforms: linux/amd64,linux/arm64
          tags: cosmtrek/air:${{ env.VERSION }}
      - name: Show docker image digest
        run: echo ${{ steps.docker_build.outputs.digest }}
